version: "3.8"

services:
  web:
    build: .
    container_name: django_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_ENGINE: mssql
      DATABASE_NAME: DISLEXIA
      DATABASE_USER: sa
      DATABASE_PASSWORD: YourStrong!Passw0rd
      DATABASE_HOST: db
      DATABASE_PORT: 1433
      DATABASE_OPTIONS_DRIVER: "ODBC Driver 17 for SQL Server"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
