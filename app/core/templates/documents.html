{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_head %}
<style>
    /* (Mantiene todos tus estilos anteriores) */
    .resource-card { transition: all 0.3s ease; }
    .resource-card:hover { transform: translateY(-8px); }
    .resource-image { position: relative; overflow: hidden; }
    .resource-image::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 50%;
        background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }
    .category-badge { backdrop-filter: blur(10px); }
    .filter-btn.active { background-color: #8b5cf6; color: white; }
    .category-videos { background-color: rgba(239,68,68,0.9); }
    .category-libros { background-color: rgba(59,130,246,0.9); }
    .category-enlaces { background-color: rgba(34,197,94,0.9); }
    .category-articulos { background-color: rgba(249,115,22,0.9); }
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .modal { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .tab-button.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
</style>
{% endblock %}

{% block content %}
<!-- (Aquí va TODO tu contenido, igual que antes, sin cambios hasta el final del bloque "content") -->
{{ block.super }}
{% endblock %}

{% block extra_scripts %}
<script>
(function initResourcesPage() {
    console.log('Inicializando página de recursos...');

    const filterButtons = document.querySelectorAll('.filter-btn');
    const resourceCards = document.querySelectorAll('.resource-card');
    const searchInput = document.getElementById('search-input');

    // === FILTRADO POR CATEGORÍA ===
    filterButtons.forEach(button => {
        button.addEventListener('click', function () {
            filterButtons.forEach(btn => {
                btn.classList.remove('active', 'bg-purple-500', 'text-white');
                btn.classList.add('text-gray-700', 'dark:text-gray-300');
            });

            this.classList.add('active', 'bg-purple-500', 'text-white');
            this.classList.remove('text-gray-700', 'dark:text-gray-300');

            const filter = this.getAttribute('data-filter');

            resourceCards.forEach(card => {
                if (filter === 'all' || card.getAttribute('data-category') === filter) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });

    // === BÚSQUEDA DE RECURSOS ===
    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const term = this.value.toLowerCase();
            resourceCards.forEach(card => {
                const name = card.getAttribute('data-name') || '';
                const desc = card.getAttribute('data-description') || '';
                if (name.includes(term) || desc.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    }
})();

// === FUNCIONES DEL MODAL ===
function openCreateModal() {
    document.getElementById('resourceModal').classList.remove('hidden');
    document.getElementById('modalTitle').textContent = 'Agregar Recurso';
    document.getElementById('resourceForm').reset();
    document.getElementById('resourceId').value = '';
    document.getElementById('resourceType').value = 'videos';
    switchTab('videos');
}

function closeModal() {
    document.getElementById('resourceModal').classList.add('hidden');
}

function switchTab(tabName) {
    const tabs = ['videos', 'libros', 'enlaces', 'articulos'];
    tabs.forEach(tab => {
        const button = document.getElementById(`tab-${tab}`);
        const fields = document.getElementById(`fields-${tab}`);
        if (tab === tabName) {
            button.classList.add('active');
            fields.classList.remove('hidden');
        } else {
            button.classList.remove('active');
            fields.classList.add('hidden');
        }
    });
    document.getElementById('resourceType').value = tabName;
}

// === FUNCIONES DE CRUD (básicas para ejemplo) ===
function submitForm() {
    const form = document.getElementById('resourceForm');
    const formData = new FormData(form);

    fetch("{% url 'crear_recurso' %}", {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': formData.get('csrfmiddlewaretoken') }
    })
    .then(response => {
        if (response.ok) {
            alert('Recurso guardado correctamente');
            location.reload();
        } else {
            alert('Error al guardar el recurso');
        }
    })
    .catch(err => console.error('Error:', err));
}

function editRecurso(tipo, id) {
    console.log(`Editar recurso tipo ${tipo} ID ${id}`);
    // Aquí puedes cargar los datos con fetch() e insertar en el modal
    openCreateModal();
    document.getElementById('modalTitle').textContent = 'Editar Recurso';
}

function deleteRecurso(tipo, id) {
    if (!confirm('¿Seguro que deseas eliminar este recurso?')) return;

    fetch(`/recursos/eliminar/${id}/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(response => {
        if (response.ok) {
            alert('Recurso eliminado');
            location.reload();
        } else {
            alert('Error al eliminar el recurso');
        }
    })
    .catch(err => console.error(err));
}
</script>
{% endblock %}
