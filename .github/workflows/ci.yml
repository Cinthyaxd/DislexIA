name: DislexIA CI Pipeline

on:
  push:
    branches: [ "main", "dev_Cinthia" ]
  pull_request:
    branches: [ "main", "dev_Cinthia" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8

    - name: Revisión de Calidad (Linting)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Pruebas
      run: |
        # Solo ejecuta si existe el archivo, sino no rompe el pipeline
        if [ -f manage.py ]; then python manage.py test; else echo "No manage.py found"; fi

    - name: Build Docker Image
      run: |
        docker build -t dislexia-web:latest .