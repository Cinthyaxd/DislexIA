name: DislexIA CI Pipeline

# El pipeline se activa al hacer push o pull request en main y develop
on:
  push:
    branches: [ "main", "dev_Cinthia" ]
  pull_request:
    branches: [ "main", "dev_Cinthia" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        # Instala las librerías de tu proyecto
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8  # Para revisión de código (Linting)

    - name: Revisión de Calidad (Linting con Flake8)
      run: |
        # Falla si hay errores de sintaxis o variables no definidas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Pruebas Automatizadas
      run: |
        # Ejecuta los tests de Django
        python manage.py test